services:

  controller:
    image: nginx:alpine
    container_name: crud_controller
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - api
    networks:
      - crud_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crud_api
    volumes:
      - ./backend:/var/www
    depends_on:
      - database
      - searcher
    networks:
      - crud_network

  database:
    image: mysql:8.0
    container_name: crud_database
    restart: always
    environment:
      MYSQL_DATABASE: customer_crud
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: crud_user
      MYSQL_PASSWORD: crud_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crud_network

  searcher:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
    container_name: crud_searcher
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - crud_network

networks:
  crud_network:
    driver: bridge

volumes:
  db_data:
  es_data: